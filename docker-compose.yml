version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: medicalcenter-postgres
    environment:
      POSTGRES_DB: medicalcenter_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: